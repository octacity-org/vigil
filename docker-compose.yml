# Vigil - local Docker release (decision 0008, docs/ARCHITECTURE.md)
# Reached only from localhost: ports are strictly bound to 127.0.0.1.

name: vigil

services:
  server:
    image: ghcr.io/octacity-org/vigil-server:latest
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      - VIGIL_DATA_DIR=/data
      - NODE_ENV=production
    volumes:
      - vigil-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:8787/v1/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    image: ghcr.io/octacity-org/vigil-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://127.0.0.1:8787
      - NODE_ENV=production
    depends_on:
      server:
        condition: service_healthy

volumes:
  vigil-data:
