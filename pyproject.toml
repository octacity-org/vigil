[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vigil"
version = "0.0.1"
description = "Deterministic signal detection for Borsa Istanbul financial statements from KAP data. Not investment advice."
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# 1.4.2 is the oldest DuckDB the loader and the schema views were tested with.
db = ["duckdb>=1.4.2"]
dev = ["pytest>=8", "ruff>=0.6", "duckdb>=1.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
# Markdown code blocks quote code verbatim (e.g. the buggy regex in docs/VIGIL.md).
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]
