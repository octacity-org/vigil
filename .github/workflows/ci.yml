name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      # A Next.js build can fail where `tsc` passes (#267). `bun --cwd apps/web run build` prints
      # the help text and exits 0, so the flag has to come after `run`.
      - name: Build apps/web
        run: bun run --cwd apps/web build

  # Golden dataset and other raw-file tests (#128, decision 0007). The raw KAP files are not in the
  # repository: the files listed in tests/raw_files.txt are downloaded from KAP and cached, so KAP is
  # only contacted when the list changes or the cache expires.
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: kap-raw-${{ hashFiles('tests/raw_files.txt') }}
      - name: Download the raw KAP files the tests need
        run: bun run download --files tests/raw_files.txt data/raw
      - name: Run all tests with the raw files
        run: bun test

  # The release images (#260, #261): built and started, so a Dockerfile change that breaks them fails the pull
  # request. They are not pushed here (#266).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the server image
        run: docker build -f apps/server/Dockerfile -t vigil-server .
      - name: Build the web image
        run: docker build -f apps/web/Dockerfile -t vigil-web .
      - name: Both images become healthy
        run: |
          docker run -d --name server -e VIGIL_DATA_DIR=/data vigil-server
          docker run -d --name web vigil-web
          for c in server web; do
            for i in $(seq 1 30); do
              s=$(docker inspect -f '{{.State.Health.Status}}' $c)
              [ "$s" = healthy ] && break
              sleep 2
            done
            echo "$c: $s"
            [ "$s" = healthy ] || { docker logs $c; exit 1; }
          done
